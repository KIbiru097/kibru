# VyOS Golden Image Configuration
# --------------------------------
# This defines the expected "known good" configuration sections.
# The Auditor compares each router's running config against these values.

firewall:
  all-ping: "enable"
  broadcast-ping: "disable"
  config-trap: "disable"
  ipv6-receive-redirects: "disable"
  ipv6-src-route: "disable"
  ip-src-route: "disable"
  log-martians: "enable"
  syn-cookies: "enable"
  receive-redirects: "disable"
  send-redirects: "enable"
  source-validation: "disable"
  twa-hazards-protection: "disable"

service:
  ssh:
    port: 22
    disable-password-authentication: true
    loglevel: "INFO"

system:
  login:
    # Only these users should exist
    allowed_users:
      - "vyos"
      - "sentinel"

  ntp:
    servers:
      - "0.pool.ntp.org"
      - "1.pool.ntp.org"
      - "2.pool.ntp.org"

  syslog:
    global:
      facility: "all"
      level: "info"
    remote_host: ""  # Set to your syslog collector IP

  hostname_pattern: "^vyos-r[0-9]+$"

  name-server:
    - "8.8.8.8"
    - "8.8.4.4"

protocols:
  static: {}
  ospf:
    log-adjacency-changes: true

interfaces:
  loopback:
    lo:
      description: "Management Loopback"

---
# Nornir host inventory for VyOS routers.
# Add your routers here.

vyos-r1:
  hostname: "192.168.1.1"
  port: 22
  username: "vyos"
  password: "vyos"
  platform: "vyos"
  groups:
    - vyos_routers
  data:
    site: "hq"
    role: "edge"

